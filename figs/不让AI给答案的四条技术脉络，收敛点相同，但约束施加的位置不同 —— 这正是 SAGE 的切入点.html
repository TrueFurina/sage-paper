<svg viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">「不让 AI 直接给答案」的四条技术脉络</text>
  <text x="340" y="44" text-anchor="middle" font-size="11" fill="#64748b">收敛点相同，但约束施加的位置不同 —— 这正是 SAGE 的切入点</text>

  <!-- ① -->
  <rect x="20" y="62" width="310" height="88" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="36" y="84" font-size="12.5" font-weight="600" fill="#991b1b">① 苏格拉底式追问</text>
  <text x="36" y="103" font-size="10.5" fill="#7f1d1d">约束位置：prompt 层</text>
  <text x="36" y="120" font-size="10.5" fill="#7f1d1d">代表：ChatGPT study mode · SocraticLM</text>
  <text x="36" y="138" font-size="10.5" fill="#7f1d1d">手段：系统提示词「请用提问引导学生」</text>

  <!-- ② -->
  <rect x="350" y="62" width="310" height="88" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text x="366" y="84" font-size="12.5" font-weight="600" fill="#9a3412">② 认知支架式</text>
  <text x="366" y="103" font-size="10.5" fill="#7c2d12">约束位置：输出后处理层</text>
  <text x="366" y="120" font-size="10.5" fill="#7c2d12">代表：Scaffolding Cards · graduated hinting</text>
  <text x="366" y="138" font-size="10.5" fill="#7c2d12">手段：生成后过滤 / 分级提示模板</text>

  <!-- ③ -->
  <rect x="20" y="162" width="310" height="88" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="36" y="184" font-size="12.5" font-weight="600" fill="#166534">③ 学习者建模式</text>
  <text x="36" y="203" font-size="10.5" fill="#14532d">约束位置：输入侧</text>
  <text x="36" y="220" font-size="10.5" fill="#14532d">代表：IntelliCode · 408Lab · Chudziak</text>
  <text x="36" y="238" font-size="10.5" fill="#14532d">手段：先建模学情，再据缺口定制</text>

  <!-- ④ -->
  <rect x="350" y="162" width="310" height="88" rx="8" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <text x="366" y="184" font-size="12.5" font-weight="700" fill="#1e40af">④ 可训练约束式 ← SAGE</text>
  <text x="366" y="203" font-size="10.5" fill="#1e3a8a">约束位置：损失函数</text>
  <text x="366" y="220" font-size="10.5" fill="#1e3a8a">代表：SAGE（检索未见同类工作）</text>
  <text x="366" y="238" font-size="10.5" fill="#1e3a8a">手段：互信息正则化，泄露量有上界</text>

  <!-- 汇聚 -->
  <path d="M175,250 L175,272 L340,272" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
  <path d="M505,250 L505,272 L340,272" stroke="#64748b" stroke-width="1.4" fill="none"/>
  <path d="M175,250 L175,272" stroke="#64748b" stroke-width="1.4" fill="none"/>
  <path d="M340,272 L340,292" stroke="#64748b" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <rect x="60" y="294" width="560" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="316" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">①②③ 的共同弱点</text>
  <text x="340" y="336" text-anchor="middle" font-size="10.8" fill="#475569">约束都在「生成之后」或「生成之外」：事后校验可绕过、规则可被自然语言顶开、</text>
  <text x="340" y="352" text-anchor="middle" font-size="10.8" fill="#475569">prompt 只是「祈祷模型听话」—— 没有任何一条给出「泄露量的上界」</text>

  <!-- 底部结论 -->
  <rect x="60" y="376" width="560" height="76" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="340" y="398" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">SAGE 的位置</text>
  <text x="340" y="418" text-anchor="middle" font-size="10.8" fill="#1e3a8a">把「不给答案」从一句提示词，变成训练目标里的一项可量化约束</text>
  <text x="340" y="436" text-anchor="middle" font-size="10.8" fill="#1e3a8a">λ 调节约束强度 → 泄露率成为可测量、可优化、有理论界的量</text>
</svg>
