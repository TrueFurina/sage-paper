<svg viewBox="0 0 680 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>防止 AI 直接给答案的四条技术脉络</title>
<desc>对比苏格拉底式、认知支架式、学习者建模式、可训练约束式四类方法，标注各自机制与代表工作。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="30" font-family="system-ui,sans-serif" font-size="15" font-weight="500" fill="#2C2C2A">防止 AI 直接给答案：四条互不相同的技术脉络</text>

<g>
<rect x="40" y="50" width="290" height="128" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="58" y="74" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#0C447C">① 苏格拉底式追问</text>
<text x="58" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">机制：只反问，不给结论</text>
<text x="58" y="116" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">约束：Prompt 系统指令</text>
<text x="58" y="140" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#0C447C">代表</text>
<text x="58" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#185FA5">ChatGPT study mode、SocraticLM</text>
</g>

<g>
<rect x="350" y="50" width="290" height="128" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="368" y="74" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#085041">② 认知支架式</text>
<text x="368" y="96" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">机制：分层提示，逐级加详</text>
<text x="368" y="116" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">约束：规则 / 句子框架 / 分类器</text>
<text x="368" y="140" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#085041">代表</text>
<text x="368" y="158" font-family="system-ui,sans-serif" font-size="12" fill="#0F6E56">Scaffolding Cards、graduated hinting</text>
</g>

<g>
<rect x="40" y="196" width="290" height="128" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="58" y="220" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#633806">③ 学习者建模式</text>
<text x="58" y="242" font-family="system-ui,sans-serif" font-size="12" fill="#854F0B">机制：先定位卡点，再决定给什么</text>
<text x="58" y="262" font-family="system-ui,sans-serif" font-size="12" fill="#854F0B">约束：知识图谱 / 掌握度追踪</text>
<text x="58" y="286" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#633806">代表</text>
<text x="58" y="304" font-family="system-ui,sans-serif" font-size="12" fill="#854F0B">IntelliCode、408Lab、Chudziak</text>
</g>

<g>
<rect x="350" y="196" width="290" height="128" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5"/>
<text x="368" y="220" font-family="system-ui,sans-serif" font-size="13.5" font-weight="500" fill="#791F1F">④ 可训练约束式</text>
<text x="368" y="242" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">机制：把"不泄答案"写进损失函数</text>
<text x="368" y="262" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">约束：互信息正则 = 数学上界</text>
<text x="368" y="286" font-family="system-ui,sans-serif" font-size="12" font-weight="500" fill="#791F1F">代表</text>
<text x="368" y="304" font-family="system-ui,sans-serif" font-size="12" fill="#A32D2D">SAGE（本项目）— 目前未见同类</text>
</g>

<line x1="340" y1="360" x2="340" y2="392" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<rect x="40" y="392" width="600" height="76" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="58" y="416" font-family="system-ui,sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">①②③ 三支的共同弱点</text>
<text x="58" y="440" font-family="system-ui,sans-serif" font-size="12" fill="#444441">约束都在生成之后或之外 — 事后校验可被绕过，规则可被自然语言顶开，</text>
<text x="58" y="458" font-family="system-ui,sans-serif" font-size="12" fill="#444441">Prompt 只是"祈祷模型听话"。没有任何一条给出"泄露量的上界"。</text>
</svg>
