<svg viewBox="0 0 680 500" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L6.5,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="600" fill="#0f172a">SAGE 学习闭环：泄露监测点在「引导」，不在「批改」</text>

  <!-- 学生 -->
  <rect x="20" y="52" width="100" height="46" rx="23" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.6"/>
  <text x="70" y="80" text-anchor="middle" font-size="12" font-weight="600" fill="#312e81">学生提问</text>

  <!-- 拆题 -->
  <rect x="150" y="40" width="130" height="70" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="215" y="62" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">① 知识点拆解</text>
  <text x="215" y="79" text-anchor="middle" font-size="9.8" fill="#64748b">BayesG 自我图推断</text>
  <text x="215" y="95" text-anchor="middle" font-size="9.8" fill="#64748b">一题 → N 个知识点</text>

  <!-- 定位 -->
  <rect x="310" y="40" width="130" height="70" rx="7" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.4"/>
  <text x="375" y="62" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">② 学情定位</text>
  <text x="375" y="79" text-anchor="middle" font-size="9.8" fill="#64748b">MRAgent 图记忆</text>
  <text x="375" y="95" text-anchor="middle" font-size="9.8" fill="#64748b">哪个知识点卡住了</text>

  <!-- 引导 -->
  <rect x="470" y="34" width="190" height="82" rx="7" fill="#fef2f2" stroke="#dc2626" stroke-width="2.2"/>
  <text x="565" y="56" text-anchor="middle" font-size="11.5" font-weight="700" fill="#991b1b">③ 引导对话 ← 泄露监测点</text>
  <text x="565" y="74" text-anchor="middle" font-size="9.8" fill="#7f1d1d">L1 反诘 / L2 局部提示 / L3 微讲</text>
  <text x="565" y="90" text-anchor="middle" font-size="9.8" fill="#7f1d1d">MIR3 互信息正则化硬约束</text>
  <text x="565" y="106" text-anchor="middle" font-size="9.8" fill="#b91c1c">Telling@N 就在这里测</text>

  <path d="M120,75 L150,75" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M280,75 L310,75" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>
  <path d="M440,75 L470,75" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 学生作答 -->
  <rect x="470" y="146" width="190" height="56" rx="7" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="565" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#166534">④ 学生独立作答</text>
  <text x="565" y="186" text-anchor="middle" font-size="9.8" fill="#14532d">无泄露 · 独立解出 = earned solve</text>
  <path d="M565,116 L565,146" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 批改 -->
  <rect x="250" y="146" width="190" height="56" rx="7" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="345" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#1e40af">⑤ AI 批改</text>
  <text x="345" y="186" text-anchor="middle" font-size="9.8" fill="#1e3a8a">对错 + 错因归类（此处给答案 OK）</text>
  <path d="M470,174 L440,174" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 能力图 -->
  <rect x="20" y="146" width="200" height="56" rx="7" fill="#faf5ff" stroke="#9333ea" stroke-width="1.6"/>
  <text x="120" y="168" text-anchor="middle" font-size="11.5" font-weight="600" fill="#6b21a8">⑥ 能力图更新</text>
  <text x="120" y="186" text-anchor="middle" font-size="9.8" fill="#581c87">知识点 × 掌握度 + 置信度</text>
  <path d="M250,174 L220,174" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 出题 -->
  <rect x="20" y="228" width="200" height="56" rx="7" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/>
  <text x="120" y="250" text-anchor="middle" font-size="11.5" font-weight="600" fill="#9a3412">⑦ 靶向出题</text>
  <text x="120" y="268" text-anchor="middle" font-size="9.8" fill="#7c2d12">只打最弱的 1-2 个知识点</text>
  <path d="M120,202 L120,228" stroke="#334155" stroke-width="1.6" marker-end="url(#a2)"/>

  <!-- 回环 -->
  <path d="M220,256 L640,256 L640,116" stroke="#334155" stroke-width="1.5" fill="none" stroke-dasharray="5,4"/>
  <text x="430" y="248" text-anchor="middle" font-size="10" fill="#64748b">回到引导（难度递增）</text>

  <!-- 实时总结 -->
  <rect x="60" y="306" width="560" height="76" rx="8" fill="#f0fdfa" stroke="#0d9488" stroke-width="1.8"/>
  <text x="340" y="330" text-anchor="middle" font-size="12.5" font-weight="600" fill="#115e59">⑧ 实时能力总结（你要加的那块）</text>
  <text x="340" y="350" text-anchor="middle" font-size="10.5" fill="#134e4a">每轮作答后立即回写能力图，并输出「你现在会什么 / 卡在哪 / 下一步打哪个」</text>
  <text x="340" y="368" text-anchor="middle" font-size="10.5" fill="#134e4a">这是「自我认知不清晰」的对症药 —— 把模糊的「我好像不太会」变成具名知识点</text>

  <rect x="60" y="400" width="560" height="80" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="340" y="424" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">为什么「做完交给 AI 批改」还不够</text>
  <text x="340" y="444" text-anchor="middle" font-size="10.5" fill="#475569">批改只告诉你「这题错了」——它发生在④之后，此时答案已经可以给了，没有泄露问题</text>
  <text x="340" y="462" text-anchor="middle" font-size="10.5" fill="#475569">泄露问题全部发生在③：那一刻 AI 手里有答案，学生又在要 —— 这里才是必须约束的位置</text>
</svg>
