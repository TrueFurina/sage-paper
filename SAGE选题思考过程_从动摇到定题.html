<svg viewBox="0 0 680 556" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SAGE 选题思考过程：从起点、动摇、取证到定题</title>
<desc>六个阶段的纵向流程：起点、想换方向、取证后否掉、发现领域缺口正对我们、转念改第一宣称、定题。</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<text x="40" y="24" font-family="var(--font-sans)" font-size="14" font-weight="500" fill="#2C2C2A" dominant-baseline="central">选题过程：一次认真考虑过的换方向，和最后为什么没换</text>

<g>
<rect x="60" y="48" width="560" height="52" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="80" y="68" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#042C53" dominant-baseline="central">① 起点：引导式教学系统，让 AI 不给答案</text>
<text x="80" y="86" font-family="var(--font-sans)" font-size="12" fill="#185FA5" dominant-baseline="central">目标期刊 FEDC；场景 计算机 408</text>
</g>
<line x1="340" y1="100" x2="340" y2="126" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="126" width="560" height="52" rx="10" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
<text x="80" y="146" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#633806" dominant-baseline="central">② 动摇：撞车太密，一度想换方向</text>
<text x="80" y="164" font-family="var(--font-sans)" font-size="12" fill="#854F0B" dominant-baseline="central">提案：诊断 + 知识追踪 + 防幻觉 + 图谱化 RAG + 贝叶斯出题</text>
</g>
<line x1="340" y1="178" x2="340" y2="204" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="204" width="560" height="52" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="80" y="224" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#2C2C2A" dominant-baseline="central">③ 取证：新方向反而更挤 → 否掉</text>
<text x="80" y="242" font-family="var(--font-sans)" font-size="12" fill="#444441" dominant-baseline="central">已有专门综述 / 已是厂商标准做法 / 贝叶斯出题是 1970s 教科书方法</text>
</g>
<line x1="340" y1="256" x2="340" y2="282" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="282" width="560" height="52" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="80" y="302" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#04342C" dominant-baseline="central">④ 关键发现：领域自己列出的缺口，正对着我们已有的东西</text>
<text x="80" y="320" font-family="var(--font-sans)" font-size="12" fill="#0F6E56" dominant-baseline="central">撤除帮助后仍有效 / 能归因到哪个机制 / 对谁在什么条件下有效</text>
</g>
<line x1="340" y1="334" x2="340" y2="360" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="360" width="560" height="52" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="80" y="380" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#26215C" dominant-baseline="central">⑤ 转念：第一宣称从「我们做了个新系统」改为「我们提供缺失的归因测量」</text>
<text x="80" y="398" font-family="var(--font-sans)" font-size="12" fill="#534AB7" dominant-baseline="central">核心指标：把改善拆成「脚手架起作用」与「只是少给答案」两部分</text>
</g>
<line x1="340" y1="412" x2="340" y2="438" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
<rect x="60" y="438" width="560" height="52" rx="10" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="80" y="458" font-family="var(--font-sans)" font-size="13" font-weight="500" fill="#173404" dominant-baseline="central">⑥ 定题：When Does Guidance Still Help?</text>
<text x="80" y="476" font-family="var(--font-sans)" font-size="12" fill="#3B6D11" dominant-baseline="central">区分脚手架的功劳 vs 只是少泄题，408 课堂实证</text>
</g>

<rect x="60" y="508" width="560" height="36" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
<text x="80" y="526" font-family="var(--font-sans)" font-size="12" fill="#444441" dominant-baseline="central">同一个实验里，「脚手架」与「少泄题」两条通道独立可关，才能作差归因。</text>
</svg>
