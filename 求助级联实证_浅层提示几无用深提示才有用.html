<svg viewBox="0 0 680 254" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>提示求助的级联效应与逐层成功率</title>
<desc>首次尝试成功率 78%；请求第 1 层提示后成功率降至 21%，且 87% 会继续请求第 2 层；第 2 层后 37%，88% 继续请求第 3 层；第 3 层（接近给答案）后回升至 82%。</desc>

<text x="40" y="28" font-family="var(--font-sans)" font-size="15" font-weight="500" fill="#2C2C2A">求助一旦开始就停不下来</text>
<text x="40" y="50" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="#5F5E5A">Goldin, Koedinger &amp; Aleven (2012), EDM · 几何 ITS 数据集 · 成功率把「继续求助」计为未成功</text>

<rect x="40" y="72" width="120" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="98" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">首次尝试</text>
<text x="100" y="126" font-family="var(--font-sans)" font-size="20" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">78%</text>
<rect x="56" y="144" width="88" height="4" rx="2" fill="#D3D1C7"/>
<rect x="56" y="144" width="68.6" height="4" rx="2" fill="#2C2C2A"/>

<path d="M160 114 L200 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="200" y="72" width="120" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="260" y="98" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">第 1 层提示</text>
<text x="260" y="126" font-family="var(--font-sans)" font-size="20" font-weight="500" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">21%</text>
<rect x="216" y="144" width="88" height="4" rx="2" fill="#D3D1C7"/>
<rect x="216" y="144" width="18.5" height="4" rx="2" fill="#A32D2D"/>

<path d="M320 114 L360 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="360" y="72" width="120" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="420" y="98" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">第 2 层提示</text>
<text x="420" y="126" font-family="var(--font-sans)" font-size="20" font-weight="500" fill="#A32D2D" text-anchor="middle" dominant-baseline="central">37%</text>
<rect x="376" y="144" width="88" height="4" rx="2" fill="#D3D1C7"/>
<rect x="376" y="144" width="32.6" height="4" rx="2" fill="#A32D2D"/>

<path d="M480 114 L520 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="520" y="72" width="120" height="84" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="580" y="98" font-family="var(--font-sans)" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">第 3 层提示</text>
<text x="580" y="126" font-family="var(--font-sans)" font-size="20" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">82%</text>
<rect x="536" y="144" width="88" height="4" rx="2" fill="#D3D1C7"/>
<rect x="536" y="144" width="72.2" height="4" rx="2" fill="#2C2C2A"/>

<text x="180" y="60" font-family="var(--font-sans)" font-size="11" font-weight="500" fill="#A32D2D" text-anchor="middle">87% 继续要</text>
<text x="340" y="60" font-family="var(--font-sans)" font-size="11" font-weight="500" fill="#A32D2D" text-anchor="middle">88% 继续要</text>

<text x="40" y="192" font-family="var(--font-sans)" font-size="11" font-weight="400" fill="#5F5E5A">读法：只给「方向」的第 1 层提示几乎买不到成功（21%）——因为 87% 的学生会立刻要下一层；</text>
<text x="40" y="212" font-family="var(--font-sans)" font-size="11" font-weight="400" fill="#5F5E5A">要到第 3 层（已接近给答案）成功率才回到 82%。学生要的不是方向，是答案。</text>
<text x="40" y="236" font-family="var(--font-sans)" font-size="11" font-weight="400" fill="#5F5E5A">这组数字正是「为什么守约约束必须做在机制里」——提示一发出去，就收不回来了。</text>
</svg>
